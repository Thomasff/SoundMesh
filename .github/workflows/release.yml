# Turns a tag into a package somebody can install.
#
# Pushing a tag is the whole ceremony: `git tag v0.2.0 && git push origin v0.2.0`. The tag is
# also where the version number comes from - see app/build.gradle.kts - so there is one place a
# version is written down rather than two that can disagree.
name: Release

on:
  push:
    tags: ["v*"]

# Creating a release and attaching a file to it are writes. Named here because the default for a
# workflow is read-only, and a workflow that can only read is one fewer thing to worry about.
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # v0.2.0. The build strips the v.
      SOUNDMESH_VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - run: chmod +x gradlew

      # The key arrives as one line of base64 because a secret holds text and a keystore is
      # binary. Written to the runner's temporary directory rather than into the checkout, so
      # that no later step can sweep it into an artifact by accident.
      #
      # Missing, this says so and carries on. An unsigned package is a useless package, but it
      # is a loud kind of useless - it refuses to install - whereas stopping the run here would
      # look like the build broke.
      - name: Unpack the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "No KEYSTORE_BASE64 secret: this package will be UNSIGNED." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SOUNDMESH_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      # The passwords reach Gradle as environment variables and never as command-line arguments,
      # which any other process on the machine can read. Actions also masks a secret's value
      # wherever it would otherwise be printed, so an accidental echo comes out as ***.
      - name: Build
        env:
          SOUNDMESH_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SOUNDMESH_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SOUNDMESH_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      # Says out loud whether the thing about to be published is signed, because the one way to
      # find that out otherwise is for somebody to fail to install it.
      #
      # Two things can go wrong here and they get two different sentences, because they send
      # whoever reads them to different places. The first release said UNSIGNED about a package
      # that was signed: a runner carries several build-tools, the glob expanded to all of them,
      # and the line ran the first as the command with the rest as its arguments. Pick one.
      - name: Check it is signed
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          SIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          if [ -z "$SIGNER" ]; then
            echo "Could not check $APK: no apksigner under ANDROID_HOME=${ANDROID_HOME:-unset}" \
              >> "$GITHUB_STEP_SUMMARY"
          elif ! "$SIGNER" verify --print-certs "$APK"; then
            echo "UNSIGNED: $APK" >> "$GITHUB_STEP_SUMMARY"
          fi

      # The gh command is already on the runner and authenticates with the token this workflow
      # was given, so there is no third-party action in the one job that handles the signing key.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            app/build/outputs/apk/release/*.apk \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
