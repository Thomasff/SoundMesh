# Builds the project on a machine that has nothing of it on it.
#
# That is what this is for, more than the tests. Nearly every "it works on mine" turns out to be
# a file that was never committed, a tool that happened to be installed, or a property somebody
# set months ago and forgot. A runner is a fresh virtual machine every time and knows none of
# those, so all three arrive here as a red cross instead of as somebody's bug report.
name: Build

on:
  push:
    branches: ["**"]
  pull_request:

# A second push to a branch makes the first run's answer worthless before it arrives. Stop it
# rather than pay for both and read the stale one first.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # The runner starts with an empty disk. This is what puts the repository on it, at the one
      # commit that triggered the run.
      - uses: actions/checkout@v5

      # Android's SDK is already on GitHub's Ubuntu image. The JDK is, but not necessarily this
      # one: 17 is what app/build.gradle.kts compiles against, so it is named rather than assumed.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          # Gradle's downloaded dependencies, carried over from the last run. A speed-up and
          # nothing else: a run that misses this cache has to reach the same verdict as one that
          # hits it, or the cache is hiding something rather than saving time.
          cache: gradle

      - run: chmod +x gradlew

      # One command, because the exit code is the whole verdict - a compile error, a failing
      # test and a missing resource all leave here non-zero and all turn the run red.
      # The handset and what it shares, named: a bare test would take in the Windows modules too,
      # which need JDK 25 and a Windows audio stack this Linux runner has neither of.
      - run: ./gradlew :core:test :app:test :app:assembleDebug --no-daemon

      # Which test, when it is a test. Uploaded only on failure, because on a green run nobody
      # opens it and it is the slowest step here.
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: test-reports
          path: app/build/reports/tests/

      # The virtual machine is deleted the moment this job ends, so anything worth keeping has
      # to be handed over before then. This one is so a build can be installed and listened to
      # without checking the commit out.
      - uses: actions/upload-artifact@v5
        with:
          name: soundmesh-debug
          path: app/build/outputs/apk/debug/*.apk

  # The computer's modules, on the one system they run on. Apart from the job above so a red
  # cross says which half broke.
  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      # 25 for :desktop's toolchain, 17 last so Gradle itself runs on 17 as everywhere else.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            25
            17
          cache: gradle

      # Gradle does not look where setup-java installs, so it is told which variable holds 25.
      - run: ./gradlew.bat :desktop:test :desktop-app:compileKotlin --no-daemon "-Porg.gradle.java.installations.fromEnv=JAVA_HOME_25_X64"

      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: desktop-test-reports
          path: desktop/build/reports/tests/
